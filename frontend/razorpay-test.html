<!DOCTYPE html>
<html>
<head>
    <title>Razorpay Test</title>
</head>

<body>
    <h2>Razorpay Test Payment</h2>

    <button id="pay-btn">Pay ₹980</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>
        // Use ONE fresh access token here.
        const accessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI0OTc5NDU5MS1jNGZlLTQyMzgtYjQyYy01YjlmNWVmNzk3MjQiLCJyb2xlIjoiQ1VTVE9NRVIiLCJpYXQiOjE3ODk1MzY2MjAsImV4cCI6MTc4OTU0MDIyMH0.DFiW4lhn1Wgkipr_QtHwbtiLBvH50LsqOqBUexIICzE";

        const options = {
            key: "rzp_test_SWWziKiIioAoGC",

            // 49000 paise = ₹490
            amount: 59700,
            currency: "INR",

            name: "Delirium",
            description: "Test Order",

            // Returned by your backend
            order_id: "order_TcawjsxIEWqtyx",

            handler: async function (response) {
                console.log("Razorpay response:", response);

                try {
                    const result = await fetch(
                        "http://localhost:3000/api/v1/payment/verify",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json",
                                "Authorization": `Bearer ${accessToken}`
                            },

                            body: JSON.stringify({
                                razorpay_order_id:
                                    response.razorpay_order_id,

                                razorpay_payment_id:
                                    response.razorpay_payment_id,

                                razorpay_signature:
                                    response.razorpay_signature
                            })
                        }
                    );

                    const data = await result.json();

                    console.log(
                        "Verification status:",
                        result.status
                    );

                    console.log(
                        "Backend verification:",
                        data
                    );

                    if (!result.ok) {
                        alert(
                            `Payment verification failed.\n\n` +
                            `Status: ${result.status}\n` +
                            `Message: ${data.message || "Unknown error"}`
                        );

                        return;
                    }

                    alert("Payment verified successfully!");

                } catch (error) {
                    console.error(
                        "Verification request failed:",
                        error
                    );

                    alert("Could not connect to backend.");
                }
            }
        };

        const razorpay = new Razorpay(options);

        document
            .getElementById("pay-btn")
            .onclick = function () {
                razorpay.open();
            };
    </script>
</body>
</html>
